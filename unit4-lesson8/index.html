rtts-a261267f8b8a9b28b0a31eadb7aaa0fdfe81c88155906db48d06e4ef.mp3"}, {"front": "Do you want a little more coffee?", "back": "Θέλεις λίγο περισσότερο καφέ;", "audio": "hypertts-859bc8f1efbd05489fb77990ce72afd231ceaba6ce0e77b9f1fefff4.mp3"}, {"front": "Do you want a little more?", "back": "Θέλεις λίγο περισσότερο;", "audio": "hypertts-7026be2effbb31718f1a1d5353132daa296e33c8dc7ba47a6383ec7a.mp3"}, {"front": "You try", "back": "προσπαθείς", "audio": "hypertts-fef273a29c6c6f49c77487181fd491c7f1d1435d0e06352ddd2502dc.mp3"}, {"front": "You have to try more", "back": "πρέπει να προσπαθήσεις περισσότερο", "audio": "hypertts-575bfa4d27d0def86ed151f60356a498c7b899cb887a7deb932db420.mp3"}, {"front": "You have to eat more", "back": "πρέπει να φας περισσότερο", "audio": "hypertts-ac86d0d44c580d82b7d39d2f4aefcb21be640aedd829fabbba7d69b1.mp3"}, {"front": "You have to eat more (generally)", "back": "πρέπει να τρως περισσότερο", "audio": "hypertts-65dffbbfed6aa22057d0a10ee48d1addc8b0799908b31d4067ebe94a.mp3"}, {"front": "I travel", "back": "ταξιδεύω", "audio": "hypertts-31f4a07839a63da48b023134aff949f23938d0afbeeb807cf9665dd8.mp3"}, {"front": "You have to travel more (generally)", "back": "πρέπει να ταξιδεύεις περισσότερο", "audio": "hypertts-2b6f2b0085e4a7db87329dda96770dbf6cfd30a5b64fa5d69008cf01.mp3"}, {"front": "What do you like more?", "back": "Τι σου αρέσει περισσότερο;", "audio": "hypertts-e036219ec4c5a99304ed8e0a9998802c80d707367086be8302eafdfe.mp3"}, {"front": "More things", "back": "περισσότερα πράγματα", "audio": "hypertts-f0f37a52d890c667cad6f3a9a98e6c6e30bebd66a21bc6584559fd5a.mp3"}, {"front": "very", "back": "πολύ", "audio": "hypertts-572dd93d638791e6f8fe0d31e26d847f84a449e733d54a2b6d47956e.mp3"}, {"front": "I am very far away", "back": "είμαι πολύ μακριά", "audio": "hypertts-5a16bae1674c78d08db10d7527bd66bc61e91c2201fdaf95da614b38.mp3"}, {"front": "I am very far away from you", "back": "είμαι πολύ μακριά σου", "audio": "hypertts-010d482d40eff8c16044e245614939898b89b60 function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let deck=shuffle(CARDS);let pos=0;let currentAudio=null;
function updateProgress(){
  document.getElementById('current-num').textContent=pos+1;
  document.getElementById('total-num').textContent=deck.length;
  document.getElementById('prog').style.width=Math.round(((pos+1)/deck.length)*100)+'%';
  document.getElementById('prev-btn').disabled=pos===0;
}
function showCard(){
  const card=deck[pos];
  document.getElementById('card-inner').classList.remove('flipped');
  document.getElementById('eng-text').textContent=card.front;
  document.getElementById('greek-text').textContent=card.back;
  document.getElementById('audio-btn').classList.remove('playing');
  document.getElementById('tap-hint').style.display='';
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  updateProgress();
}
function flipCard(){
  const flipped=document.getElementById('card-inner').classList.toggle('flipped');
  if(flipped){document.getElementById('tap-hint').style.display='none';playAudio();}
  else{document.getElementById('tap-hint').style.display='';}
}
function playAudio(){
  const card=deck[pos];
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  const btn=document.getElementById('audio-btn');
  const audio=new Audio(AUDIO_PATH+card.audio);
  currentAudio=audio;btn.classList.add('playing');
  audio.play().catch(()=>{});
  audio.onended=()=>{btn.classList.remove('playing');currentAudio=null;};
  audio.onerror=()=>{btn.classList.remove('playing');currentAudio=null;};
}
function nextCard(){if(pos<deck.length-1){pos++;showCard();}else{showDone();}}
function prevCard(){if(pos>0){pos--;showCard();}}
function showDone(){
  document.getElementById('study-view').classList.add('hidden');
  document.getElementById('done-view').classList.remove('hidden');
}
function restart(){
  deck=shuffle(CARDS);pos=0;
  document.getElementById('done-view').classList.add('hidden');
  document.getElementById('study-view').classList.remove('hidden');
  showCard();
}
showCard();
</script>
</body>
