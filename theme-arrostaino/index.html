const CARDS=[{"front": "I get sick", "back": "αρρωσταίνω / αρρωστήσω", "audio": "hypertts-8fffcd52318d7d4f06044e0e3d8bf467549ee55804e5eb8a25ea291c.mp3"}, {"front": "I hurt / I'm in pain", "back": "πονάω / πονέσω", "audio": "hypertts-ed53732aa2ffa5634638f11e05f9320e5be372722bc7b5d5f178debf.mp3"}, {"front": "I feel", "back": "νιώθω / νιώσω", "audio": "hypertts-ddf1c0ad06ef2ec773c99129305fdc73f637f36d60f00cf4020d338c.mp3"}, {"front": "I book (an appointment)", "back": "κλείνω / κλείσω", "audio": "hypertts-406452adeab544bfd1f467eb3e08fd26a3e9b63747442ced91185f65.mp3"}, {"front": "I take (medicine)", "back": "παίρνω / πάρω", "audio": "hypertts-d2ead15108a156cf64e7587149fbcc5978c82d4939fcab0d4a360a7c.mp3"}, {"front": "I go", "back": "πηγαίνω / πάω", "audio": "hypertts-eba909937e4f55270837967f3066c02e189ccb5ac90912327bae2999.mp3"}, {"front": "I wait", "back": "περιμένω", "audio": "hypertts-b073899cec107ef843b7d1343d6905e9d83aebfa90ea2e9ba4e8a306.mp3"}, {"front": "I examine", "back": "εξετάζω / εξετάσω", "audio": "hypertts-7334238bb5b8d465bb09ae5b7167140fa542c751025e1e41f227b93a.mp3"}, {"front": "I prescribe", "back": "συνταγογραφώ / συνταγογραφήσω", "audio": "hypertts-a0bd8b3ccfca48ea6141d96b4c6e8bcfc994517208cc07710a0a0902.mp3"}, {"front": "I need", "back": "χρειάζομαι / χρειαστώ", "audio": "hypertts-30955375c49a91133868a4cd1688f44bedb68bcc36ff9a3027921889.mp3"}, {"front": "I rest", "back": "ξεκουράζομαι / ξεκουραστώ", "audio": "hypertts-c010361ab5dc83c133258b69b6099447f57b8ab6ce654d80d25c2990.mp3"}, {"front": "I get better", "back": "βελτιώνομαι / βελτιωθώ", "audio": "hypertts-bd184f3bb38a42c1c627da5ee749b73aa85729a5415712f3483309ea.mp3"}, {"front": "I get worse", "back": "χειροτερεύω / χειροτερέψω", "audio": "hypertts-38f5026c5388e8f443779408b4afd6217c8ba4e031dd7824fff925b0.mp3"}, {"front": "my … hurts", "back": "Με πονάει…", "audio": "hypertts-6b374c5790166b63248e1689291db0f5c12585abfbd10d32c00d0dfc.mp3"}, {"front": "I have…", "back": "Έχω…", "audio": "hypertts-9ec5d81807021e536bd1c16909acaa34e6311bb0860b1dd610244200.mp3"}, {"front": "the pain", "back": "ο πόνος", "audio": "hypertts-d6e3ac1ee01d1ccdf4026338ccb59f85d1b3ead515b481e61cc0cfa0.mp3"}, {"front": "the fever", "back": "ο πυρετός", "audio": "hypertts-690e7ae62f048962b5ff03ddc0a32b0ae1f3304a1b0152a8492cd58c.mp3"}, {"front": "the cough", "back": "ο βήχας", "audio": "hypertts-fb24d05c47b8140bd52e9d3f3eb99dbb52c5535b59c15753163bfc35.mp3"}, {"front": "the cold", "back": "το κρυολόγημα", "audio": "hypertts-5a9246c4bf8396f2e92d04a6e8313edd3bfd5f2de91e2e02693f669f.mp3"}, {"front": "the flu", "back": "η γρίπη", "audio": "hypertts-b7643aae792e8dad48fdbf83fa78984028be5e4cf77c133610b249d5.mp3"}, {"front": "dizziness", "back": "η ζαλάδα", "audio": "hypertts-ea010c1a43e64272e8c600fae6659f1f724bb9c2fcca32755e0fd152.mp3"}, {"front": "the allergy", "back": "η αλλεργία", "audio": "hypertts-97e8a4da36f8c27d17f2e1d03049f8a43ec931a358ddc8545c11cf28.mp3"}, {"front": "I don't feel well", "back": "Δεν νιώθω καλά", "audio": "hypertts-f7b9aa9f28cb64b3a0da5b5f6c3f1dfecfce92a6d250a09ba2c7c4cd.mp3"}, {"front": "I'm sick (masc.)", "back": "Είμαι άρρωστος", "audio": "hypertts-6c260fff70922be6ca0a66217540134c1212ce9ad8c43d6672311b3d.mp3"}, {"front": "I'm sick (fem.)", "back": "Είμαι άρρωστη", "audio": "hypertts-1a961641d3ed56466f652f4d023cc686d6c1f34d583ced6e3739d467.mp3"}, {"front": "the pharmacy", "back": "το φαρμακείο", "audio": "hypertts-0ddda34cfac95d47474f8bdf0a0124a9e009f34da9c2a8f491c565a2.mp3"}, {"front": "the pharmacist", "back": "ο φαρμακοποιός", "audio": "hypertts-381c56f02133a7fa00ec0a3f2794a29e9ac2b1627f97b0303b488b65.mp3"}, {"front": "the medicine", "back": "το φάρμακο", "audio": "hypertts-33dcabf39d85b42d77ecd828d64483ca8b01e466df859fc484487ab3.mp3"}, {"front": "the pill", "back": "το χάπι", "audio": "hypertts-ce14e2a54b9b8dd5ba51a5c4d84a3d490d45a14eccb184dc1d463a03.mp3"}, {"front": "the syrup", "back": "το σιρόπι", "audio": "hypertts-307289c382a6ce428cf74c3163da428de4e07345165df4b0dd63d524.mp3"}, {"front": "the ointment", "back": "η αλοιφή", "audio": "hypertts-abbe663c95245d3534ce3c8782f98d06801b3018f07e3dec7adb3908.mp3"}, {"front": "the painkiller", "back": "το παυσίπονο", "audio": "hypertts-9c8883e6f2ea3ceada76efd6e32bfa2483b22bd3d11d16bdc3cb9f90.mp3"}, {"front": "the antibiotics", "back": "τα αντιβιοτικά", "audio": "hypertts-2e26bdea95d84ca0956b1a23acc1a1ae2fd957a2485599fe925cc760.mp3"}, {"front": "the prescription", "back": "η συνταγή", "audio": "hypertts-cc083e0db2ec52a6c458bc26d915ea1003d56fab1d45f27c7e669bb4.mp3"}, {"front": "without a prescription", "back": "χωρίς συνταγή", "audio": "hypertts-c477d432a2e50f4b152407338be559dafef3065c999560faf4be9f93.mp3"}, {"front": "the dose", "back": "η δόση", "audio": "hypertts-29e051992ce8bfd80ee623ad6751ff5315169049d75075ad26839fe4.mp3"}, {"front": "Do you have something for…?", "back": "Έχετε κάτι για…;", "audio": "hypertts-48b45ad1a4253d08950e3779438f9c06c79024f69a72cfe22143bf1f.mp3"}, {"front": "What do you recommend?", "back": "Τι μου προτείνετε;", "audio": "hypertts-b0a31af40458cefa9bd371cf8b4fa70413034152a4c24666dee3267a.mp3"}, {"front": "How often do I take it?", "back": "Πόσο συχνά το παίρνω;", "audio": "hypertts-d366349565edd0c4f0707d17a9c42ac933ea88b2e11ca928f1c98cd4.mp3"}, {"front": "Do I need a prescription?", "back": "Χρειάζομαι συνταγή;", "audio": "hypertts-aa122366afc8441ab27107bd70bb16990e441106e1f76e583b350752.mp3"}, {"front": "the appointment", "back": "το ραντεβού", "audio": "hypertts-d2b7da4659b2c61eb657b10fcf5490b34f3c3056e7d704b2718fcf10.mp3"}, {"front": "the doctor", "back": "ο γιατρός / η γιατρός", "audio": "hypertts-e0474e294438f95ec2093c9c70cef54680f7b6b2a8c30cc7e0ffe0e6.mp3"}, {"front": "the doctor's office", "back": "το ιατρείο", "audio": "hypertts-71423aa17fd0dc2ea50af9d56a7f4b362c084e4aee5d6970db47d5c4.mp3"}, {"front": "I'd like to book an appointment", "back": "Θέλω να κλείσω ραντεβού", "audio": "hypertts-118c00c8c64bdfbc757f74d767196392aa104bf028a2bcccc95d0b94.mp3"}, {"front": "What time do you have available?", "back": "Τι ώρα έχετε διαθέσιμο;", "audio": "hypertts-bd4c8b3f6be0165472fd321a9c3de79e5441138c6539f374dd9a905e.mp3"}, {"front": "When can I come?", "back": "Πότε μπορώ να έρθω;", "audio": "hypertts-47e8c43214359296e7a1a36a5b27d685226baed867e3d35ad31aadce.mp3"}, {"front": "morning / afternoon", "back": "το πρωί / το απόγευμα", "audio": "hypertts-fc6482034ea60426e7c37ba1d0ce375dd8acb4489717e02dc670d06c.mp3"}, {"front": "today / tomorrow / on Tuesday", "back": "σήμερα / αύριο / την Τρίτη", "audio": "hypertts-20c88e2360f2298e7ac8996578beba97fba9840868dbab039935a6a5.mp3"}, {"front": "It's urgent", "back": "Είναι επείγον", "audio": "hypertts-5443ba9aa9b4e13e58b6aada33b84d10f22fd8ffe66e18c2f4319850.mp3"}, {"front": "Can I come earlier?", "back": "Μπορώ να έρθω νωρίτερα;", "audio": "hypertts-9a483a4ee8465539666552b729639b00a44638cef069b0395d14c6d7.mp3"}, {"front": "my name is…", "back": "το όνομά μου είναι…", "audio": "hypertts-4abc413a2406eb3d6edd9e693e633d94af0b08c0b19cd5e5f255fd1e.mp3"}, {"front": "the phone number", "back": "ο αριθμός τηλεφώνου", "audio": "hypertts-21bdcaf588d1c2018b4c9ff2b4acacb6688f1521a331dfef0438e77b.mp3"}, {"front": "the examination", "back": "η εξέταση", "audio": "hypertts-e4841e9daa72d3571bf5152c18b379433ed24e9a758f67edf7ee6da4.mp3"}, {"front": "the waiting room", "back": "η αίθουσα αναμονής", "audio": "hypertts-b1928f3440c6d60be9cc347c1aa1087a67d5136c000ab83bd5334ead.mp3"}, {"front": "the GP", "back": "ο παθολόγος", "audio": "hypertts-cd99957fd193e305e829667ec6917d8c00dc0ae278368264597e21c0.mp3"}, {"front": "What's the problem? (doctor asks)", "back": "Τι πρόβλημα έχετε;", "audio": "hypertts-c414e4d5b62aa5aeaf44f2c09eb214d9d3727ea5a459f1adfedc20ae.mp3"}, {"front": "Where does it hurt?", "back": "Πού πονάτε;", "audio": "hypertts-37721ca143f16e38cb7a94e7b8a3a5e88afbea65aa3f4c21471d4cfb.mp3"}, {"front": "Since when?", "back": "Από πότε;", "audio": "hypertts-50c6551d5822ddda4c6e0de1877a929bb5681d03af33760080 function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let deck=shuffle(CARDS);let pos=0;let currentAudio=null;
function updateProgress(){
  document.getElementById('current-num').textContent=pos+1;
  document.getElementById('total-num').textContent=deck.length;
  document.getElementById('prog').style.width=Math.round(((pos+1)/deck.length)*100)+'%';
  document.getElementById('prev-btn').disabled=pos===0;
}
function showCard(){
  const card=deck[pos];
  document.getElementById('card-inner').classList.remove('flipped');
  document.getElementById('eng-text').textContent=card.front;
  document.getElementById('greek-text').textContent=card.back;
  document.getElementById('audio-btn').classList.remove('playing');
  document.getElementById('tap-hint').style.display='';
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  updateProgress();
}
function flipCard(){
  const flipped=document.getElementById('card-inner').classList.toggle('flipped');
  if(flipped){document.getElementById('tap-hint').style.display='none';playAudio();}
  else{document.getElementById('tap-hint').style.display='';}
}
function playAudio(){
  const card=deck[pos];
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  const btn=document.getElementById('audio-btn');
  const audio=new Audio(AUDIO_PATH+card.audio);
  currentAudio=audio;btn.classList.add('playing');
  audio.play().catch(()=>{});
  audio.onended=()=>{btn.classList.remove('playing');currentAudio=null;};
  audio.onerror=()=>{btn.classList.remove('playing');currentAudio=null;};
}
function nextCard(){if(pos<deck.length-1){pos++;showCard();}else{showDone();}}
function prevCard(){if(pos>0){pos--;showCard();}}
function showDone(){
  document.getElementById('study-view').classList.add('hidden');
  document.getElementById('done-view').classList.remove('hidden');
}
function restart(){
  deck=shuffle(CARDS);pos=0;
  document.getElementById('done-view').classList.add('hidden');
  document.getElementById('study-view').classList.remove('hidden');
  showCard();
}
showCard();
</script>
