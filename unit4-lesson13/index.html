e are going to my friend's house (female friend)", "back": "πάμε στο σπίτι της φίλης μου", "audio": "hypertts-f2c263c4d0641abaa806809e22557de2961da4913b564f79cbb6acbd.mp3"}, {"front": "Let's go", "back": "Πάμε", "audio": "hypertts-2767d01c954639236283df5c1836886f359010528b8acbbaed71cb25.mp3"}, {"front": "Do you know which is Maria's car?", "back": "ξέρεις ποιο είναι το αυτοκίνητο της Μαρίας;", "audio": "hypertts-10a2c98b6f26a1d6cedc6118331d7f4fc525f7981bb78b383e21e163.mp3"}, {"front": "The beginning", "back": "Η αρχή", "audio": "hypertts-4403f8d6a5a34765b9003a11f8b80acc54c3c8954214b6cf9e1ea2cd.mp3"}, {"front": "Her beginning", "back": "Η αρχή της", "audio": "hypertts-75b0f77379745508afc0657f24cd9d84e35eba71cb0eff37bc566656.mp3"}, {"front": "Spring", "back": "η άνοιξη", "audio": "hypertts-1af81fde63542c4cb6babd08048daff21329432ce41e2d297f869297.mp3"}, {"front": "The beginning of spring", "back": "η αρχή της άνοιξης", "audio": "hypertts-7eb99aec67769cf4e8b2af4dcd9ed2610a8ff0f445282d087c7773d8.mp3"}, {"front": "We are waiting for the beginning of spring", "back": "περιμένουμε την αρχή της άνοιξης", "audio": "hypertts-2e12ed8e50c2ae905defd0a9a3365c4443c47ff79fb4d4c5af5f5c05.mp3"}, {"front": "Week", "back": "εβδομάδα", "audio": "hypertts-91d65c8d661f89b0f46edeb87e81ad5e653667ad18654450c97e6c89.mp3"}, {"front": "Every day of the week", "back": "κάθε μέρα της εβδομάδας", "audio": "hypertts-162f7ecc602816fd07b081256965dcd0a8ba49212de0df250c2ad82b.mp3"}, {"front": "The life", "back": "η Ζωή", "audio": "hypertts-fdb16c6a6e0ee4974697dc941ab03627a84e10b78334b813f21870bf.mp3"}, {"front": "All the days of my life", "back": "όλες οι μέρες της ζωής μου", "audio": "hypertts-b086a7b49dacf0046bbd3e40628b11900f7cf0268cfa2641fcfd246c.mp3"}, {"front": "We have something for every day of the week", "back": "έχουμε κάτι για κάθε μέρα της εβδομάδας", "audio": "hypertts-dd3ed2e9ca7e134123754e7b9b18963be8af67772a7ce45cc578e582.mp3"}, {"front": "The child", "back": "το παιδί", "audio": "hypert function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let deck=shuffle(CARDS);let pos=0;let currentAudio=null;
function updateProgress(){
  document.getElementById('current-num').textContent=pos+1;
  document.getElementById('total-num').textContent=deck.length;
  document.getElementById('prog').style.width=Math.round(((pos+1)/deck.length)*100)+'%';
  document.getElementById('prev-btn').disabled=pos===0;
}
function showCard(){
  const card=deck[pos];
  document.getElementById('card-inner').classList.remove('flipped');
  document.getElementById('eng-text').textContent=card.front;
  document.getElementById('greek-text').textContent=card.back;
  document.getElementById('audio-btn').classList.remove('playing');
  document.getElementById('tap-hint').style.display='';
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  updateProgress();
}
function flipCard(){
  const flipped=document.getElementById('card-inner').classList.toggle('flipped');
  if(flipped){document.getElementById('tap-hint').style.display='none';playAudio();}
  else{document.getElementById('tap-hint').style.display='';}
}
function playAudio(){
  const card=deck[pos];
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  const btn=document.getElementById('audio-btn');
  const audio=new Audio(AUDIO_PATH+card.audio);
  currentAudio=audio;btn.classList.add('playing');
  audio.play().catch(()=>{});
  audio.onended=()=>{btn.classList.remove('playing');currentAudio=null;};
  audio.onerror=()=>{btn.classList.remove('playing');currentAudio=null;};
}
function nextCard(){if(pos<deck.length-1){pos++;showCard();}else{showDone();}}
function prevCard(){if(pos>0){pos--;showCard();}}
function showDone(){
  document.getElementById('study-view').classList.add('hidden');
  document.getElementById('done-view').classList.remove('hidden');
}
function restart(){
  deck=shuffle(CARDS);pos=0;
  document.getElementById('done-view').classList.add('hidden');
  document.getElementById('study-view').classList.remove('hidden');
  showCard();
}
showCard();
</script>
