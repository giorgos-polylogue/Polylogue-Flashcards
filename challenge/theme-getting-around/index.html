<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6-Week Challenge — Getting Around</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f4f0; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; color: #1a1a1a; }
  #app { width: 100%; max-width: 520px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
  .back-link { font-size: 13px; color: #888; text-decoration: none; display: flex; align-items: center; gap: 5px; }
  .back-link:hover { color: #1a1a1a; }
  .deck-tag { font-size: 12px; color: #888; background: #fff; border: 1px solid #e5e5e5; padding: 4px 12px; border-radius: 99px; }
  .progress-bar { height: 3px; background: #e5e5e5; border-radius: 99px; overflow: hidden; margin-bottom: 1.25rem; }
  .progress-fill { height: 100%; background: #534AB7; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .counter { text-align: center; font-size: 13px; color: #888; margin-bottom: 1.5rem; letter-spacing: 0.02em; }
  .counter strong { color: #1a1a1a; font-weight: 600; }
  .card-scene { perspective: 1200px; margin-bottom: 1rem; cursor: pointer; user-select: none; }
  .card-inner { position: relative; width: 100%; transform-style: preserve-3d; transition: transform 0.45s cubic-bezier(0.4,0,0.2,1); }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 2.5rem 2rem; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .card-back { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotateY(180deg); }
  .card-label { font-size: 11px; color: #bbb; letter-spacing: 0.08em; text-transform: uppercase; }
  .card-text { font-size: 24px; font-weight: 500; color: #1a1a1a; text-align: center; line-height: 1.35; }
  .card-text.greek { font-size: 26px; }
  .audio-btn { display: flex; align-items: center; gap: 7px; padding: 7px 16px; border: 1px solid #e0e0e0; border-radius: 99px; background: transparent; color: #888; font-size: 13px; cursor: pointer; transition: background 0.15s; font-family: inherit; }
  .audio-btn:hover { background: #f5f4f0; color: #555; }
  .audio-btn.playing { color: #534AB7; border-color: #534AB7; }
  .tap-hint { text-align: center; font-size: 13px; color: #bbb; margin-bottom: 1rem; height: 20px; }
  .nav-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1.5rem; }
  .nav-btn { padding: 14px 4px; border-radius: 10px; border: 1px solid #e5e5e5; background: #fff; cursor: pointer; font-size: 14px; font-weight: 500; font-family: inherit; color: #1a1a1a; transition: background 0.15s, opacity 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .nav-btn:hover:not(:disabled) { background: #f5f4f0; }
  .nav-btn.primary { background: #534AB7; color: #fff; border-color: #534AB7; }
  .nav-btn.primary:hover { opacity: 0.9; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .hidden { display: none !important; }
  .done-screen { background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 2.5rem 2rem; text-align: center; }
  .done-title { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
  .done-sub { font-size: 14px; color: #888; margin-bottom: 1.5rem; line-height: 1.5; }
  .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .action-btn { padding: 11px 28px; border: 1px solid #e0e0e0; border-radius: 10px; background: transparent; color: #1a1a1a; font-size: 14px; font-family: inherit; cursor: pointer; transition: background 0.15s, opacity 0.15s; text-decoration: none; display: inline-block; }
  .action-btn:hover { background: #f5f4f0; }
  .action-btn.primary { background: #534AB7; color: #fff; border-color: #534AB7; }
  .action-btn.primary:hover { opacity: 0.9; }
  @media (max-width: 400px) { .card-text { font-size: 18px; } .card-text.greek { font-size: 20px; } .card-face { padding: 2rem 1.25rem; min-height: 170px; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <a href="/challenge/" class="back-link">
      <svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2L4 6l4 4"/></svg>
      All lessons
    </a>
    <span class="deck-tag">Themes</span>
  </header>
  <div id="study-view">
    <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
    <div class="counter"><strong id="current-num">1</strong> of <span id="total-num">0</span></div>
    <div class="card-scene" onclick="flipCard()">
      <div class="card-inner" id="card-inner">
        <div class="card-face">
          <span class="card-label">English</span>
          <div class="card-text" id="eng-text">—</div>
        </div>
        <div class="card-face card-back">
          <span class="card-label">Greek</span>
          <div class="card-text greek" id="greek-text">—</div>
          <button class="audio-btn" id="audio-btn" onclick="event.stopPropagation(); playAudio()">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M3 6H1v4h2l4 3V3L3 6zM11.5 8c0-1.5-.8-2.8-2-3.5v7c1.2-.7 2-2 2-3.5zM14 8c0-2.8-1.6-5.2-4-6.3v1.1C11.8 3.7 13 5.7 13 8s-1.2 4.3-3 5.2v1.1C12.4 13.2 14 10.8 14 8z"/></svg>
            Listen
          </button>
        </div>
      </div>
    </div>
    <p class="tap-hint" id="tap-hint">Tap to reveal the Greek</p>
    <div class="nav-row">
      <button class="nav-btn" onclick="prevCard()" id="prev-btn">← Previous</button>
      <button class="nav-btn primary" onclick="nextCard()" id="next-btn">Next →</button>
    </div>
  </div>
  <div id="done-view" class="done-screen hidden">
    <div class="done-title">Deck complete</div>
    <div class="done-sub">You've gone through all the cards. Practice makes perfect — go again!</div>
    <div class="btn-row">
      <button class="action-btn primary" onclick="restart()">Practice again</button>
      <a href="/challenge/" class="action-btn">All lessons</a>
    </div>
  </div>
</div>
<script>
const AUDIO_PATH='audio/';
const CARDS=[{"front": "I go", "back": "πηγαίνω / πάω", "audio": "hypertts-eba909937e4f55270837967f3066c02e189ccb5ac90912327bae2999.mp3"}, {"front": "I take (the bus, a taxi)", "back": "παίρνω / πάρω", "audio": "hypertts-d2ead15108a156cf64e7587149fbcc5978c82d4939fcab0d4a360a7c.mp3"}, {"front": "I arrive, I get there", "back": "φτάνω / φτάσω", "audio": "hypertts-cd95f1544dac8ab3186b7fb1a53a6177685a4ebaa7a1e7a14cf0044c.mp3"}, {"front": "I leave", "back": "φεύγω / φύγω", "audio": "hypertts-2ab09047a7969bd1f868ecec5a6640056fc2657225b27bc9b5850dd4.mp3"}, {"front": "I wait (the same both ways)", "back": "περιμένω / περιμένω", "audio": "hypertts-ba9311249505f56bca08907e11be4d10e15c60507a771b0af168289d.mp3"}, {"front": "I get on, I go up", "back": "ανεβαίνω / ανέβω", "audio": "hypertts-d2d0f0d09efff17526aa14368e9b3a093a0102aa8092ab697e50dd74.mp3"}, {"front": "I get off, I go down", "back": "κατεβαίνω / κατέβω", "audio": "hypertts-1914633160de1fd00855d2730e615aa3a243e7ba77e8006bb38596ff.mp3"}, {"front": "I turn", "back": "στρίβω / στρίψω", "audio": "hypertts-f1b64d4b715f39fd7b040e86e2ecbd3a66f00a2b7a7851b2d8390811.mp3"}, {"front": "I look for", "back": "ψάχνω / ψάξω", "audio": "hypertts-472c93a7f1b9d073c405f0dc55ec0415bd53e956f4366448dac882e6.mp3"}, {"front": "I find", "back": "βρίσκω / βρω", "audio": "hypertts-acc7244a4ce358ed7633aacb6a1da31dfa420596eaf61f4d1a003741.mp3"}, {"front": "I ask", "back": "ρωτάω / ρωτήσω", "audio": "hypertts-5f3b34094c7f528ce308343e8989cbf6ad1ac0e425e82f93d7ed87e6.mp3"}, {"front": "I help", "back": "βοηθάω / βοηθήσω", "audio": "hypertts-f717e4eab4db459b6b6ac5b0c7679c6b080efcac0ba96ba3782beb7f.mp3"}, {"front": "I walk", "back": "περπατάω / περπατήσω", "audio": "hypertts-d2bca4752ef07d31c4fc077b3e75d6f8abf7662150959921455e4d8d.mp3"}, {"front": "I rent (a car, a scooter)", "back": "νοικιάζω / νοικιάσω", "audio": "hypertts-cdadcc70880a6ae2929fb23e23cdba77a9c69d9c36dcd3888a21e366.mp3"}, {"front": "I drive", "back": "οδηγώ / οδηγήσω", "audio": "hypertts-10c725830e4291ae65f561ca53481fef7e41c548b3f468f5504b4331.mp3"}, {"front": "the bus", "back": "το λεωφορείο", "audio": "hypertts-079d378625a1756bd93a55c8f0dd5431449d39bdaf42171b759167d0.mp3"}, {"front": "the stop", "back": "η στάση", "audio": "hypertts-f4c71a3ee1fb8775c9454ddbc887b1fe997aebd67ebaabae685044e6.mp3"}, {"front": "the taxi", "back": "το ταξί", "audio": "hypertts-913e631005d6007922318b0692304be1554b2fad7e9f026b580234e0.mp3"}, {"front": "the metro", "back": "το μετρό", "audio": "hypertts-2740df0912c96be5198ded854e183eb34c50d5d7792f997c347eb54a.mp3"}, {"front": "the station", "back": "ο σταθμός", "audio": "hypertts-8293f55cbbf2cf46cc9e03052050500573bd6c9e7727bf27ce0bf9aa.mp3"}, {"front": "the ferry, the ship", "back": "το πλοίο", "audio": "hypertts-eccf4bc9187a9167a7345eddfe84b8f25083927d42f336bfc4668d59.mp3"}, {"front": "the port", "back": "το λιμάνι", "audio": "hypertts-1bc2f2f21e8485ea29bfd6a66fb7c6c26644a3e09011d1ded513a3ad.mp3"}, {"front": "the airport", "back": "το αεροδρόμιο", "audio": "hypertts-110fb336acd7f1c631a8c32ab7caf8d63e63cc66df6633b37d2a27f1.mp3"}, {"front": "the car", "back": "το αυτοκίνητο", "audio": "hypertts-05bb2537bcf2062d324ec00ef8bfac1f1f2950577fcb6bdf78e6618a.mp3"}, {"front": "the scooter, the motorbike", "back": "το μηχανάκι", "audio": "hypertts-3fa7f37b0e73bf9bcae9742495e3c96729aaa1784bd93a860d8cd424.mp3"}, {"front": "the ticket", "back": "το εισιτήριο", "audio": "hypertts-00a1de6ded7f98d27a682ba3e35342ef23c648bdffbfab3cb01a7361.mp3"}, {"front": "the road, the street", "back": "ο δρόμος", "audio": "hypertts-23b1de12677e5a31a3314630aa2ddea502b1fd2a5a7c2853c394e4d6.mp3"}, {"front": "the square", "back": "η πλατεία", "audio": "hypertts-aa82e78d4e7f63fc2a9691e1ac83c627027d7e07502a2e02f22960c0.mp3"}, {"front": "the centre (of town)", "back": "το κέντρο", "audio": "hypertts-eae21f1c09a5384d049f24720e2b92fffba341065019ef645e87b39a.mp3"}, {"front": "the church", "back": "η εκκλησία", "audio": "hypertts-fc6647279e8b668485d09224efd81d654d181aa50ad50d82333c830d.mp3"}, {"front": "the kiosk (tickets, water, a bit of everything)", "back": "το περίπτερο", "audio": "hypertts-6ea43397ddb9e23e482439dcddc6c20c22b2ff5bde949f85bf49cda7.mp3"}, {"front": "the beach", "back": "η παραλία", "audio": "hypertts-df0c45e022de04833d5c26e17ab015a2d7698beccfa0cd5f5d0536c2.mp3"}, {"front": "the village", "back": "το χωριό", "audio": "hypertts-f214c64255bce98423623c8c24377c00c7c3a85390a53f466dcbf0e3.mp3"}, {"front": "the hotel", "back": "το ξενοδοχείο", "audio": "hypertts-b37d7a18391b0a5c251426cbf8a6177b0cf8eadc25bdfb3b28ba98ca.mp3"}, {"front": "(on the) right / (on the) left", "back": "δεξιά / αριστερά", "audio": "hypertts-13a84ca43d341f670db5868b6f556974f1ffb76ed4deecb629497c77.mp3"}, {"front": "straight on", "back": "ευθεία", "audio": "hypertts-bf60fe962c7689c2c03de07d81e7e1d3564ac7e7c05db6625b4918e9.mp3"}, {"front": "near / far", "back": "κοντά / μακριά", "audio": "hypertts-87424b693d62c004b2a0656ba88e0b2a22462aa920223ad0d165eb23.mp3"}, {"front": "next to", "back": "δίπλα σε", "audio": "hypertts-2db06474aad9f78ade2e4814d2e85de7816d01d12a3e2bbb38049e57.mp3"}, {"front": "opposite, across from", "back": "απέναντι από", "audio": "hypertts-1d789bc74daa0358c3c8c86188b73c902f0e05cea68d56ae6d439838.mp3"}, {"front": "the corner", "back": "η γωνία", "audio": "hypertts-e4af43a8bf52e63ac0bdff74e93ff907d3d620d4193eaa93c63503e7.mp3"}, {"front": "the traffic lights", "back": "το φανάρι", "audio": "hypertts-5c997d51381ad5f52701592531d9a1b5e80104bcd12084f10132e578.mp3"}, {"front": "up to, as far as", "back": "μέχρι", "audio": "hypertts-2fe9d59b6aac6e07fce4568a8ce7b413d4a14a3267f89a507b060522.mp3"}, {"front": "the minute / the minutes", "back": "το λεπτό / τα λεπτά", "audio": "hypertts-53e55a7409d46d5ff3fafc44cf9fba2f41f405c80dea5af47b104d63.mp3"}, {"front": "Excuse me, a quick question… (lit. sorry, a question…)", "back": "Συγγνώμη, μια ερώτηση…", "audio": "hypertts-bf837be35dd4c70a0b653b18c528ca837ebaa45ca3fd758a21c7e309.mp3"}, {"front": "How do I get to…? (lit. how do I go to the…?)", "back": "Πώς πάω στο…;", "audio": "hypertts-1ab1487235f2bdf826cf1bfa0fb629a7c8745e4305d02fbae51bc309.mp3"}, {"front": "How long does it take? (lit. how much time does it want?)", "back": "Πόση ώρα θέλει;", "audio": "hypertts-d7ea3f758cfe8015638844d4349290562a92e1b2f6947c2c0808b471.mp3"}, {"front": "On foot (lit. with the feet)", "back": "Με τα πόδια", "audio": "hypertts-7419cbb86eb73e952174b8452881e0ac1d8b4ba30fe93ab67785a01f.mp3"}, {"front": "How often? (lit. every when?)", "back": "Κάθε πότε;", "audio": "hypertts-b12192dc30e90fdd700d52da7392b93d6c76a24649c56360a4cd8925.mp3"}, {"front": "I'm lost! (lit. I got lost)", "back": "Χάθηκα!", "audio": "hypertts-70b031540376f10a2f6e1d579c8dc697cf4dbab4ae17775d56895f1b.mp3"}];
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let deck=shuffle(CARDS);let pos=0;let currentAudio=null;
function updateProgress(){
  document.getElementById('current-num').textContent=pos+1;
  document.getElementById('total-num').textContent=deck.length;
  document.getElementById('prog').style.width=Math.round(((pos+1)/deck.length)*100)+'%';
  document.getElementById('prev-btn').disabled=pos===0;
}
function showCard(){
  const card=deck[pos];
  document.getElementById('card-inner').classList.remove('flipped');
  document.getElementById('eng-text').textContent=card.front;
  document.getElementById('greek-text').textContent=card.back;
  document.getElementById('audio-btn').classList.remove('playing');
  document.getElementById('tap-hint').style.display='';
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  updateProgress();
}
function flipCard(){
  const flipped=document.getElementById('card-inner').classList.toggle('flipped');
  if(flipped){document.getElementById('tap-hint').style.display='none';playAudio();}
  else{document.getElementById('tap-hint').style.display='';}
}
function playAudio(){
  const card=deck[pos];
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  const btn=document.getElementById('audio-btn');
  const audio=new Audio(AUDIO_PATH+card.audio);
  currentAudio=audio;btn.classList.add('playing');
  audio.play().catch(()=>{});
  audio.onended=()=>{btn.classList.remove('playing');currentAudio=null;};
  audio.onerror=()=>{btn.classList.remove('playing');currentAudio=null;};
}
function nextCard(){if(pos<deck.length-1){pos++;showCard();}else{showDone();}}
function prevCard(){if(pos>0){pos--;showCard();}}
function showDone(){
  document.getElementById('study-view').classList.add('hidden');
  document.getElementById('done-view').classList.remove('hidden');
}
function restart(){
  deck=shuffle(CARDS);pos=0;
  document.getElementById('done-view').classList.add('hidden');
  document.getElementById('study-view').classList.remove('hidden');
  showCard();
}
showCard();
</script>
</body>
</html>
