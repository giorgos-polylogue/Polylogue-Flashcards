mal)", "back": "ζεις", "audio": "hypertts-bb3babf8c71eb2d677438be03fc018bbc04890ff85d4a2188ed36eed.mp3"}, {"front": "They live", "back": "ζούν", "audio": "hypertts-ecf77fa18a15da7aa8557175d816ba819f219393ee2d55d331778a52.mp3"}, {"front": "You live (plural / formal)", "back": "ζείτε", "audio": "hypertts-770b271f8a5b473f5aa6c9ed6538fd930b9eeaecbd72210f641da36a.mp3"}, {"front": "Where do you live? (plural / formal)", "back": "που ζείτε;", "audio": "hypertts-5a1626f44956e41c7966a25ceae33bd0bed57c645c440cf726dc5528.mp3"}, {"front": "Where do you want to live? (plural / formal)", "back": "που θέλετε να ζήσετε;", "audio": "hypertts-91263b8bca5485eb0e3a22838c3a09ac9608cca5508c8b1b4674daa0.mp3"}, {"front": "Where did you want to live? (plural / formal)", "back": "που θέλατε να ζήσετε;", "audio": "hypertts-8eb1b94b2ab658fc90724cf7eaeccc11c2492aebcdffc957dda88ff0.mp3"}, {"front": "Where did you want to live? (open period)", "back": "που θέλατε να ζείτε;", "audio": "hypertts-ac316d46d61d81fbdf8e8589f81465c60c64be516628cde1177cc21d.mp3"}, {"front": "Where would you like to live? (plural / formal)", "back": "που θα θέλατε να ζήσετε;", "audio": "hypertts-9e2524c4e1178c03ea4e075b228ca31ee3d4f64b35e1d1d68a5aa8e7.mp3"}, {"front": "Where did you live? (plural / formal)", "back": "που ζήσατε;", "audio": "hypertts-cc6c102b5879e6b57363b1b8ccac130a918c6d43db9b68253d3d1007.mp3"}, {"front": "You are speaking (plural / formal)", "back": "μιλάτε", "audio": "hypertts-f335d0ce4d8ecab11030b4f5de5b38616d7bdfaf91281da266fb68a2.mp3"}, {"front": "What are you guys talking about? (lit. about what thing)", "back": "για τι πράγμα μιλάτε", "audio": "hypertts-e3a192a483c02a603d3cbfe86059e595e4f0daadd334dfd09ee1c8a4.mp3"}, {"front": "which", "back": "ποιο", "audio": "hypertts-15a382e6098188a4bb427dd2e90cd895682cfafd26bb9866b7f18317.mp3"}, {"front": "About which thing are you talking?", "back": "για ποιο πράγμα μιλάτε;", "audio": "hypertts-d92ff48637938443062eae2ad3703a1f5241dbbb7a13e4edff0ba237.mp3"}, {"f function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let deck=shuffle(CARDS);let pos=0;let currentAudio=null;
function updateProgress(){
  document.getElementById('current-num').textContent=pos+1;
  document.getElementById('total-num').textContent=deck.length;
  document.getElementById('prog').style.width=Math.round(((pos+1)/deck.length)*100)+'%';
  document.getElementById('prev-btn').disabled=pos===0;
}
function showCard(){
  const card=deck[pos];
  document.getElementById('card-inner').classList.remove('flipped');
  document.getElementById('eng-text').textContent=card.front;
  document.getElementById('greek-text').textContent=card.back;
  document.getElementById('audio-btn').classList.remove('playing');
  document.getElementById('tap-hint').style.display='';
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  updateProgress();
}
function flipCard(){
  const flipped=document.getElementById('card-inner').classList.toggle('flipped');
  if(flipped){document.getElementById('tap-hint').style.display='none';playAudio();}
  else{document.getElementById('tap-hint').style.display='';}
}
function playAudio(){
  const card=deck[pos];
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  const btn=document.getElementById('audio-btn');
  const audio=new Audio(AUDIO_PATH+card.audio);
  currentAudio=audio;btn.classList.add('playing');
  audio.play().catch(()=>{});
  audio.onended=()=>{btn.classList.remove('playing');currentAudio=null;};
  audio.onerror=()=>{btn.classList.remove('playing');currentAudio=null;};
}
function nextCard(){if(pos<deck.length-1){pos++;showCard();}else{showDone();}}
function prevCard(){if(pos>0){pos--;showCard();}}
function showDone(){
  document.getElementById('study-view').classList.add('hidden');
  document.getElementById('done-view').classList.remove('hidden');
}
function restart(){
  deck=shuffle(CARDS);pos=0;
  document.getElementById('done-view').classList.add('hidden');
  document.getElementById('study-view').classList.remove('hidden');
  showCard();
}
showCard();
</script>
