<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polylogue — Unit 4 Lesson 12</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f4f0; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; color: #1a1a1a; }
  #app { width: 100%; max-width: 520px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
  .back-link { font-size: 13px; color: #888; text-decoration: none; display: flex; align-items: center; gap: 5px; }
  .back-link:hover { color: #1a1a1a; }
  .deck-tag { font-size: 12px; color: #888; background: #fff; border: 1px solid #e5e5e5; padding: 4px 12px; border-radius: 99px; }
  .progress-bar { height: 3px; background: #e5e5e5; border-radius: 99px; overflow: hidden; margin-bottom: 1.25rem; }
  .progress-fill { height: 100%; background: #1D9E75; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .counter { text-align: center; font-size: 13px; color: #888; margin-bottom: 1.5rem; letter-spacing: 0.02em; }
  .counter strong { color: #1a1a1a; font-weight: 600; }
  .card-scene { perspective: 1200px; margin-bottom: 1rem; cursor: pointer; user-select: none; }
  .card-inner { position: relative; width: 100%; transform-style: preserve-3d; transition: transform 0.45s cubic-bezier(0.4,0,0.2,1); }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 2.5rem 2rem; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .card-back { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotateY(180deg); }
  .card-label { font-size: 11px; color: #bbb; letter-spacing: 0.08em; text-transform: uppercase; }
  .card-text { font-size: 24px; font-weight: 500; color: #1a1a1a; text-align: center; line-height: 1.35; }
  .card-text.greek { font-size: 26px; }
  .audio-btn { display: flex; align-items: center; gap: 7px; padding: 7px 16px; border: 1px solid #e0e0e0; border-radius: 99px; background: transparent; color: #888; font-size: 13px; cursor: pointer; transition: background 0.15s; font-family: inherit; }
  .audio-btn:hover { background: #f5f4f0; color: #555; }
  .audio-btn.playing { color: #1D9E75; border-color: #1D9E75; }
  .tap-hint { text-align: center; font-size: 13px; color: #bbb; margin-bottom: 1rem; height: 20px; }
  .nav-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1.5rem; }
  .nav-btn { padding: 14px 4px; border-radius: 10px; border: 1px solid #e5e5e5; background: #fff; cursor: pointer; font-size: 14px; font-weight: 500; font-family: inherit; color: #1a1a1a; transition: background 0.15s, opacity 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .nav-btn:hover:not(:disabled) { background: #f5f4f0; }
  .nav-btn.primary { background: #1D9E75; color: #fff; border-color: #1D9E75; }
  .nav-btn.primary:hover { opacity: 0.9; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .hidden { display: none !important; }
  .done-screen { background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 2.5rem 2rem; text-align: center; }
  .done-title { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
  .done-sub { font-size: 14px; color: #888; margin-bottom: 1.5rem; line-height: 1.5; }
  .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .action-btn { padding: 11px 28px; border: 1px solid #e0e0e0; border-radius: 10px; background: transparent; color: #1a1a1a; font-size: 14px; font-family: inherit; cursor: pointer; transition: background 0.15s, opacity 0.15s; text-decoration: none; display: inline-block; }
  .action-btn:hover { background: #f5f4f0; }
  .action-btn.primary { background: #1D9E75; color: #fff; border-color: #1D9E75; }
  .action-btn.primary:hover { opacity: 0.9; }
  @media (max-width: 400px) { .card-text { font-size: 18px; } .card-text.greek { font-size: 20px; } .card-face { padding: 2rem 1.25rem; min-height: 170px; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <a href="/" class="back-link">
      <svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2L4 6l4 4"/></svg>
      All lessons
    </a>
    <span class="deck-tag">Unit 4 · Lesson 12</span>
  </header>
  <div id="study-view">
    <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
    <div class="counter"><strong id="current-num">1</strong> of <span id="total-num">0</span></div>
    <div class="card-scene" onclick="flipCard()">
      <div class="card-inner" id="card-inner">
        <div class="card-face">
          <span class="card-label">English</span>
          <div class="card-text" id="eng-text">—</div>
        </div>
        <div class="card-face card-back">
          <span class="card-label">Greek</span>
          <div class="card-text greek" id="greek-text">—</div>
          <button class="audio-btn" id="audio-btn" onclick="event.stopPropagation(); playAudio()">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M3 6H1v4h2l4 3V3L3 6zM11.5 8c0-1.5-.8-2.8-2-3.5v7c1.2-.7 2-2 2-3.5zM14 8c0-2.8-1.6-5.2-4-6.3v1.1C11.8 3.7 13 5.7 13 8s-1.2 4.3-3 5.2v1.1C12.4 13.2 14 10.8 14 8z"/></svg>
            Listen
          </button>
        </div>
      </div>
    </div>
    <p class="tap-hint" id="tap-hint">Tap to reveal the Greek</p>
    <div class="nav-row">
      <button class="nav-btn" onclick="prevCard()" id="prev-btn">← Previous</button>
      <button class="nav-btn primary" onclick="nextCard()" id="next-btn">Next →</button>

    <div class="done-sub">You've gone through all the cards. Practice makes perfect — go again!</div>

      <button class="action-btn primary" onclick="restart()">Practice again</button>
      <a href="/" class="action-btn">All lessons</a>
    </div>
  </div>
</div>
<script>
const AUDIO_PATH='audio/';
const CARDS=[{"front": "The road", "back": "ο δρόμος", "audio": "hypertts-23b1de12677e5a31a3314630aa2ddea502b1fd2a5a7c2853c394e4d6.mp3"}, {"front": "This road", "back": "αυτός ο δρόμος", "audio": "hypertts-a6b6e763cfb4a4a831cf89e925ab8ef62933263be4afb790d2f20efe.mp3"}, {"front": "I take", "back": "παίρνω", "audio": "hypertts-de81fb0f5fa49d85379f1eddae0d2bba12c9caa06612abdc1c26d863.mp3"}, {"front": "You have to take this road", "back": "πρέπει να πάρεις αυτόν τον δρόμο", "audio": "hypertts-70746f98ec5994214ef9c9d0ceb60758f6edffb3f80477e7f524d946.mp3"}, {"front": "You have to take the other road", "back": "πρέπει να πάρεις τον άλλο δρόμο", "audio": "hypertts-fed8333a3fdbdd11506453c2380694aa7e2964335ca5570b97088ddd.mp3"}, {"front": "The street", "back": "Η οδός", "audio": "hypertts-d763f369d752a8de10a816d283b9295cb5a2f31091743c108b517fda.mp3"}, {"front": "His street", "back": "η οδός του", "audio": "hypertts-e4fb19431ff91c1fde7043858c2ac90ce789b2a4fe890ba732474de3.mp3"}, {"front": "Giorgos's street", "back": "η οδός του Γιώργου", "audio": "hypertts-026ff9ea860d6fa6e2d2438fd7658dc9803aff0d186b4ee0612bb4e7.mp3"}, {"front": "Do you know where Giorgos's street is?", "back": "ξέρεις που είναι η οδός του Γιώργου;", "audio": "hypertts-6810648a408c640cbac59315b24d45fc57fb34890307f8bc5eb4d7ea.mp3"}, {"front": "Do you know where Giorgos's street is? (plural / formal)", "back": "ξέρετε που είναι η οδός του Γιώργου;", "audio": "hypertts-4a235b23328049571d7db216692be805d5f63126ef1f4cd30bb206c5.mp3"}, {"front": "Do you know which is Giorgos's street? (plural / formal)", "back": "ξέρετε ποια είναι η οδός του Γιώργου;", "audio": "hypertts-96c3c2887369ff6c0c159c3a2ecb5c2b35959f63ef3ca6f2055f7288.mp3"}, {"front": "Do you know Giorgos's street? (plural / formal)", "back": "ξέρετε την οδό του Γιώργου;", "audio": "hypertts-a5a2354b9fc394789e1631aae34fc1c9ed98cc53f309d279dfe1159e.mp3"}, {"front": "I drive", "back": "Οδηγώ", "audio": "hypertts-e6b0406e61b16b3c89406785a2812fcef9a67398f8658bca6d9a2b85.mp3"}, {"front": "It leads to", "back": "οδηγεί", "audio": "hypertts-6b35d9d00676d80b68d8f571a5b9b99630383aa0e60f6afe34a2f9fa.mp3"}, {"front": "It leads to a big stairway", "back": "οδηγεί σε μια μεγάλη σκάλα", "audio": "hypertts-3f9201bcc8cca0a8a04448e09c500c61ad988b6e232492aa8021206a.mp3"}, {"front": "My friend's street", "back": "η οδός του φίλου μου", "audio": "hypertts-b681c414808b75e67e02262a041bd3088cd4a9a22bc9490a708ff51e.mp3"}, {"front": "It leads to the street of my friend", "back": "οδηγεί στην οδό του φίλου μου", "audio": "hypertts-aff362373b098c94aaabcce143b764ab845fb4171e544a08c4f60b2e.mp3"}, {"front": "My friend's house", "back": "Το σπίτι του φίλου μου", "audio": "hypertts-7c54fb4dbd8457894068177b4b9e62b52275877009c2dcffff92628c.mp3"}, {"front": "Giorgos's house", "back": "Το σπίτι του Γιώργου", "audio": "hypertts-00dd2fa69bc7dab9a8ebda265f61245905086097035a9f4657e8c98f.mp3"}, {"front": "The man's house", "back": "το σπίτι του άντρα", "audio": "hypertts-0678ef69845b1c66b56b16919c6e59baedaf332e09b04354fc26954a.mp3"}, {"front": "It leads to the man's house", "back": "οδηγεί στο σπίτι του άντρα", "audio": "hypertts-30557d7f194822e9ac27f61d4f760ae51741a1f09c7ad16da8d83679.mp3"}, {"front": "Do you know how to drive?", "back": "ξέρεις να οδηγείς;", "audio": "hypertts-bbb80b88cd81a9a14511f2c3d354191d8746b4b740f755e39b14db38.mp3"}, {"front": "Do you know how to drive? (formal)", "back": "ξέρετε να οδηγείτε;", "audio": "hypertts-285647f7103ce9037a3e731f605c20719b2728ccab7221611dd548d6.mp3"}, {"front": "That one (masc.)", "back": "εκείνος", "audio": "hypertts-01d802346db2a94317a7642e54efa572df706c96de446265517017fa.mp3"}, {"front": "That road", "back": "εκείνος ο δρόμος", "audio": "hypertts-0b75e2f0da77b294af9e02b5f71fb407ce294f9c9b43bc36d6d4a6b1.mp3"}, {"front": "We have to take that road", "back": "πρέπει να πάρουμε εκείνον τον δρόμο", "audio": "hypertts-28b3755791a82b0df51e7786d519568796ff0e21895bfda9b9f1c0b8.mp3"}, {"front": "That new road", "back": "εκείνος ο καινούργιος δρόμος", "audio": "hypertts-b982446f0ba565c0421adb647b9b4223b6eebecf475e6166d71a6182.mp3"}, {"front": "We have to take that new road", "back": "πρέπει να πάρουμε εκείνον τον καινούργιο δρόμο", "audio": "hypertts-8a636dd3849fb7e6e448d9bf64b0d6ea80833acc7da103cf7481dc23.mp3"}, {"front": "We have to take those new roads", "back": "πρέπει να πάρουμε εκείνους τους καινούργιους δρόμους", "audio": "hypertts-8ef72a31214351d118a6d027e128bec97645d5311731699ea931aab6.mp3"}, {"front": "This is the street of Giorgos", "back": "Αυτή είναι η οδός του Γιώργου", "audio": "hypertts-2686da9f6757f789aa2d2b7e580c61c49475f1f678bd4c5e26b3163f.mp3"}, {"front": "This is my friend's street", "back": "Αυτή είναι η οδός του φίλου μου", "audio": "hypertts-0524c66f767fca1ceae83db0cbb29162e12168f4bd62aa7090a2e69f.mp3"}, {"front": "This is the street of that man we saw in the center", "back": "Αυτή είναι η οδός εκείνου του άντρα που είδαμε στο κέντρο", "audio": "hypertts-63cbdbe7da32122fd6034d8dbf157b2a8f17901e810820177fcc4dff.mp3"}, {"front": "To fix / to put together", "back": "φτιάχνω", "audio": "hypertts-c1f63588a929fda41681c3c1365ce6401c4a1effb94c0e46e890cad5.mp3"}, {"front": "A coffee", "back": "ένας καφές", "audio": "hypertts-408c7a9425d3d2dcaa14be1d869cbb944dbad0531ab57b3a89b88b9d.mp3"}, {"front": "Can you fix me a coffee?", "back": "μπορείς να μου φτιάξεις έναν καφέ;", "audio": "hypertts-a90d4b73428adfa6a7e4bdda7a03812e4ef0368c9ea4130012ab17c5.mp3"}, {"front": "Can you make a coffee for my friend?", "back": "μπορείς να φτιάξεις έναν καφέ για τον φίλο μου;", "audio": "hypertts-994581c5ecb363820e80eb5509528a4fca7ff2654e1a4caa694f01eb.mp3"}, {"front": "Which / who", "back": "ποιο / ποιος / ποια", "audio": "hypertts-331356a61345feb95b0bab0b464ece44e86640be23da9b3a2143fad1.mp3"}, {"front": "Who is this coffee for? (feminine)", "back": "για ποια είναι αυτός ο καφές;", "audio": "hypertts-d5cd090b4acf0c3afdceca2c9bb4cb23221631699265adf03228fe60.mp3"}, {"front": "Who are these coffees for? (feminine)", "back": "για ποιες είναι αυτοί οι καφέδες;", "audio": "hypertts-eb31f4ffbe22f6b8a2e30c990004396616616ec120d6ae04848408a7.mp3"}, {"front": "Who are these coffees for? (masculine)", "back": "για ποιον είναι αυτοί οι καφέδες;", "audio": "hypertts-f3a8ee0df0fab4a57e58c88fc0c0ea0d95affa765325d881df00abc1.mp3"}, {"front": "Who is it for? (plural masc. / mixed)", "back": "για ποιους είναι;", "audio": "hypertts-e26c0d83444b599be89fb2c38e627f5a050e028a4470812456d6dcf2.mp3"}, {"front": "Whose is it?", "back": "ποιανού είναι;", "audio": "hypertts-2bb6fc8ed80442c2b51e1ce6c69cf841a3cf7c36e830d8686e034077.mp3"}, {"front": "The problem", "back": "το πρόβλημα", "audio": "hypertts-6bdeca14ea031971ebabbf298dd81387b310cba5ef78282880c3c6e2.mp3"}, {"front": "The problems", "back": "τα προβλήματα", "audio": "hypertts-10bc04a8fd65c6aa86073409b4b4bc6d532c68191877777687b62659.mp3"}, {"front": "The world", "back": "κόσμος", "audio": "hypertts-e4d15d6418b02e70291762047fe96c49429a4fa33a720e7009e329a3.mp3"}, {"front": "The problems of the world", "back": "τα προβλήματα του κόσμου", "audio": "hypertts-800bd1bf5117d2c2829fce72ce52c47d637f18a0b30a8230a6a82a42.mp3"}];
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let deck=shuffle(CARDS);let pos=0;let currentAudio=null;
function updateProgress(){
  document.getElementById('current-num').textContent=pos+1;
  document.getElementById('total-num').textContent=deck.length;
  document.getElementById('prog').style.width=Math.round(((pos+1)/deck.length)*100)+'%';
  document.getElementById('prev-btn').disabled=pos===0;
}
function showCard(){
  const card=deck[pos];
  document.getElementById('card-inner').classList.remove('flipped');
  document.getElementById('eng-text').textContent=card.front;
  document.getElementById('greek-text').textContent=card.back;
  document.getElementById('audio-btn').classList.remove('playing');
  document.getElementById('tap-hint').style.display='';
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  updateProgress();
}
function flipCard(){
  const flipped=document.getElementById('card-inner').classList.toggle('flipped');
  if(flipped){document.getElementById('tap-hint').style.display='none';playAudio();}
  else{document.getElementById('tap-hint').style.display='';}
}
function playAudio(){
  const card=deck[pos];
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  const btn=document.getElementById('audio-btn');
  const audio=new Audio(AUDIO_PATH+card.audio);
  currentAudio=audio;btn.classList.add('playing');
  audio.play().catch(()=>{});
  audio.onended=()=>{btn.classList.remove('playing');currentAudio=null;};
  audio.onerror=()=>{btn.classList.remove('playing');currentAudio=null;};
}
function nextCard(){if(pos<deck.length-1){pos++;showCard();}else{showDone();}}
function prevCard(){if(pos>0){pos--;showCard();}}
function showDone(){
  document.getElementById('study-view').classList.add('hidden');
  document.getElementById('done-view').classList.remove('hidden');
}
function restart(){
  deck=shuffle(CARDS);pos=0;
  document.getElementById('done-view').classList.add('hidden');
  document.getElementById('study-view').classList.remove('hidden');
  showCard();
}
showCard();
</script>
</body>
</html>
