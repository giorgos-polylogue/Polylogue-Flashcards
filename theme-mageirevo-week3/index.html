  .card-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 2.5rem 2rem; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }

  .action-btn { padding: 11px 28px; border: 1px solid #e0e0e0; border-radius: 10px; background: transparent; color: #1a1a1a; font-size: 14px; font-family: inherit; cursor: pointer; transition: background 0.15s, opacity 0.15s; text-decoration: none; display: inline-block; }

<script>
const AUDIO_PATH='audio/';
const CARDS=[{"front": "I serve (open / closed - same form)", "back": "σερβίρω / σερβίρω", "audio": "hypertts-79a86efac333e45fb289fd53b0d80b1bcc309f6570abca42d71236fe.mp3"}, {"front": "My mum always serves the guests first.", "back": "Η μαμά μου σερβίρει πάντα πρώτα τους καλεσμένους.", "audio": "hypertts-6b6c461957680ba822b7b751f7e58feb41e1d38513c8653f010bd8de.mp3"}, {"front": "I fill / I stuff (open / closed)", "back": "γεμίζω / γεμίσω", "audio": "hypertts-a0932def737455b530b5eee3c8df4f12707da1234445d16cff826ca3.mp3"}, {"front": "Grandad fills the glasses with wine.", "back": "Ο παππούς γεμίζει τα ποτήρια με κρασί.", "audio": "hypertts-d7ca4a9b00023fc66b053af0c1f15bdb225732006badd7dad6f33b44.mp3"}, {"front": "I empty (open / closed)", "back": "αδειάζω / αδειάσω", "audio": "hypertts-0347831ef6102c4edeb65d1c7a294da95cd6135cc854037274384359.mp3"}, {"front": "The plates empty in five minutes!", "back": "Τα πιάτα αδειάζουν σε πέντε λεπτά!", "audio": "hypertts-549f1187214ad269844ed52851091ca09a4cce3729852d500a1a151a.mp3"}, {"front": "I clink (glasses) (open / closed)", "back": "τσουγκρίζω / τσουγκρίσω", "audio": "hypertts-17f784362881cc0274e0e9385d21a7e029a11d2d27ea65dbd1fbab1c.mp3"}, {"front": "We clink glasses and say cheers.", "back": "Τσουγκρίζουμε τα ποτήρια και λέμε «στην υγειά μας».", "audio": "hypertts-d5a96ae607f31044d192a0b2bfae582059358018642e72ec1f37397c.mp3"}, {"front": "We clink the eggs (at Easter)", "back": "τσουγκρίζουμε τα αυγά", "audio": "hypertts-755c60f341dc803a9bbec1820600db1a26719adb50ccd83e9d3f8b05.mp3"}, {"front": "I nibble / I have a bite (lit. I pinch) (open / closed)", "back": "τσιμπάω / τσιμπήσω", "audio": "hypertts-53f279ace17b5b8865af9622b5bd704e7c10c7e069549b967caeb4d6.mp3"}, {"front": "Do you want to have a bite before the meal?", "back": "Θέλεις να τσιμπήσουμε κάτι πριν το φαγητό;", "audio": "hypertts-2359255046cfe8c3027016d993ca9a8da2c93877159aa4b6779424ce.mp3"}, {"front": "I dip (also: I dive) (open / closed)", "back": "βουτάω / βουτήξω", "audio": "hypertts-885f450f439e504e8b26bb123ecc95744902f7c1e5dd32ccfa001901.mp3"}, {"front": "I dip the bread in the oil of the salad.", "back": "Βουτάω το ψωμί στο λάδι της σαλάτας.", "audio": "hypertts-3f730952faffe90edb605efef5c10996e6c16c401416da10d6ca3cc4.mp3"}, {"front": "I share (open / closed)", "back": "μοιράζομαι / μοιραστώ", "audio": "hypertts-60da9ba227290111054a8b743ef9df72aa82f7ae035d3e38dace7bc9.mp3"}, {"front": "In Greece we share all the dishes in the middle.", "back": "Στην Ελλάδα μοιραζόμαστε όλα τα πιάτα στη μέση.", "audio": "hypertts-a4df23184a7506d361ab8c7e36c4c5bcdff574e19b22ba650886aec0.mp3"}, {"front": "I get full (open / closed)", "back": "χορταίνω / χορτάσω", "audio": "hypertts-28aad8461de4370b4098b2e8cf77cc73646ed89658d239ae282bf166.mp3"}, {"front": "With the meze I get full before the main course comes.", "back": "Με τους μεζέδες χορταίνω πριν έρθει το κυρίως πιάτο.", "audio": "hypertts-44d9dcbb18832cf97fea345b4db618b87bed8cd6235574ebdb22062b.mp3"}, {"front": "I'm left over (open / closed)", "back": "περισσεύω / περισσέψω", "audio": "hypertts-605f94fbd519f2990bcb52eac6f59fc86d154f27bc92ba0c57b0b70b.mp3"}, {"front": "there's some left", "back": "περισσεύει", "audio": "hypertts-dd430c718e1b629d44d60949008bedab695d5d48121531ad6202d5f6.mp3"}, {"front": "There's always food left over for the next day.", "back": "Πάντα περισσεύει φαγητό για την επόμενη μέρα.", "audio": "hypertts-4ff3e971290c16cd03a76c694aea29044dcdfc6e55677ddae66f42ca.mp3"}, {"front": "I treat (someone) (open / closed)", "back": "κερνάω / κεράσω", "audio": "hypertts-7492ac185cb4063fe7f5529e760cacdc04e37faba6385f32c8ddd802.mp3"}, {"front": "Today it's on me!", "back": "Σήμερα κερνάω εγώ!", "audio": "hypertts-cb7c616ac12f7e4895a41f53f9e548dafe8c9d6738b7f642beca8d9a.mp3"}, {"front": "I clear (the table) / I collect (open / closed)", "back": "μαζεύω / μαζέψω", "audio": "hypertts-3b719765b4e5e6c79cdf28da51db37defe9f0eda088659897ce02a10.mp3"}, {"front": "After the meal we all clear the table together.", "back": "Μετά το φαγητό μαζεύουμε το τραπέζι όλοι μαζί.", "audio": "hypertts-7330304dadf8009474a4c9ce2e696ef983da52dfaa469f7d491cf83e.mp3"}, {"front": "the tablecloth", "back": "το τραπεζομάντιλο", "audio": "hypertts-ab13ccf7c1f6ae0c6c15a439b03a7d3cce3a3a00d9f0e38071f2d5a4.mp3"}, {"front": "For the holidays we put on the good tablecloth.", "back": "Για τις γιορτές στρώνουμε το καλό τραπεζομάντιλο.", "audio": "hypertts-fda4cdc2875429141504578a2db55fe1663ce0b3f4fcf8475aa11395.mp3"}, {"front": "the paper napkin", "back": "η χαρτοπετσέτα", "audio": "hypertts-5dbfebd91ed118cd720e3d24116f0489bccb475913b077e8aaeac3c5.mp3"}, {"front": "Can you give me a napkin?", "back": "Μου δίνεις μια χαρτοπετσέτα;", "audio": "hypertts-966a268195629ec635d396310d2d5166d5c633ca16c291d0e571667a.mp3"}, {"front": "the platter", "back": "η πιατέλα", "audio": "hypertts-bc2b4947bc64ba872915f1e8766a764f72aae928eb8f820da060c541.mp3"}, {"front": "The roast comes on a big platter.", "back": "Το ψητό έρχεται σε μια μεγάλη πιατέλα.", "audio": "hypertts-da0da9999ba4064270d62cdcafc1fdc4c54ed7445cdd191284a02885.mp3"}, {"front": "the jug", "back": "η κανάτα", "audio": "hypertts-b7bebab90f7214724a0fbb6a58f45124e3f4c4143c76cb5699fc46fe.mp3"}, {"front": "A jug of water please.", "back": "Μια κανάτα νερό παρακαλώ.", "audio": "hypertts-bfedd5060a6c9e5732eb07565414e7cf20acb98020ede407573ca958.mp3"}, {"front": "the portion", "back": "η μερίδα", "audio": "hypertts-a998979c392b72fe6bb77b5d0390ec4d75448b1aedc71b3cfd5b32d7.mp3"}, {"front": "Portions in Greece are very big!", "back": "Οι μερίδες στην Ελλάδα είναι πολύ μεγάλες!", "audio": "hypertts-5afd6d74f46572a66da1bb9c8c42cd6eccc37c2812fdfd227e625019.mp3"}, {"front": "the bite / the sip", "back": "η μπουκιά / η γουλιά", "audio": "hypertts-579ce55e3d835be0eb82d4d615d9082f3a6c6f43eaa1dd05420bc4ea.mp3"}, {"front": "Just one bite! And a sip of wine.", "back": "Μια μπουκιά μόνο! Και μια γουλιά κρασί.", "audio": "hypertts-53da6bf26a1fcdc59035e3097fcd28710168f00a68e8073db51ea244.mp3"}, {"front": "the food container (from Tupperware)", "back": "το τάπερ", "audio": "hypertts-1b65856660b834359c45eb8ba8531fdbf581553516d536eb60631c73.mp3"}, {"front": "My mum always gives me a container of food.", "back": "Η μαμά μου μου δίνει πάντα ένα τάπερ με φαγητό.", "audio": "hypertts-d24b52b5e160bc6a77aa322290f545f3111760681b2051abdaf5d61b.mp3"}, {"front": "meze (small dishes to share)", "back": "οι μεζέδες", "audio": "hypertts-5feeee66eb2da51a35156ca420acec7c1be62eb5ad48f56b6a6bf82a.mp3"}, {"front": "We get lots of meze and share them.", "back": "Παίρνουμε πολλούς μεζέδες και τους μοιραζόμαστε.", "audio": "hypertts-5921e4df51bfceea2f643c934211af35e18fc5de2697707886eaec14.mp3"}, {"front": "the starters / the main course", "back": "τα ορεκτικά / το κυρίως πιάτο", "audio": "hypertts-77a928b9d0f40223cd0cd1021762858c9fb792ea10fcd8ca0f3d4527.mp3"}, {"front": "For starters we get tzatziki and for the main course fish.", "back": "Για ορεκτικά παίρνουμε τζατζίκι και για κυρίως πιάτο ψάρι.", "audio": "hypertts-86fcdc2753dcfe2afc96a03231d17d5acc296ead5f808ee3f786d40a.mp3"}, {"front": "vegetables cooked in olive oil", "back": "τα λαδερά", "audio": "hypertts-3a84cc0e14e4b046282f3a4d992385eab51e33d3f7e3c618d6a9d57a.mp3"}, {"front": "Gemista and green beans are ladera.", "back": "Τα γεμιστά και τα φασολάκια είναι λαδερά.", "audio": "hypertts-640559c65bcede7b05e03acd93d6e0363e2663bb5c36a53b010b12df.mp3"}, {"front": "stuffed vine leaves", "back": "τα ντολμαδάκια", "audio": "hypertts-14dd122b4a99aee69f877456b92b282b73101240822d0153aaf686e7.mp3"}, {"front": "My grandmother used to stuff the vine leaves one by one.", "back": "Η γιαγιά μου γέμιζε τα ντολμαδάκια ένα ένα.", "audio": "hypertts-f91f6b0195fcf7eabc3ca6d110943ea89167f3daae3f70b7c8b9703b.mp3"}, {"front": "giant baked beans (lit. the giants)", "back": "οι γίγαντες", "audio": "hypertts-f9503796f1d64b8a570d7c53854a2a44f8ca7cac482a3fc5a67acc24.mp3"}, {"front": "We bake the giant beans in the oven with tomato.", "back": "Ψήνουμε τους γίγαντες στον φούρνο με ντομάτα.", "audio": "hypertts-1a9bcfccdde1da5ea4e6b11a4842780bf2ac931d97865d7d5332b86a.mp3"}, {"front": "meat cooked in tomato sauce", "back": "το κοκκινιστό", "audio": "hypertts-523fb368642eecd1084643c471c59e6a5fd605d939cde2cd33302351.mp3"}, {"front": "On Sundays we always used to eat kokkinisto with pasta.", "back": "Την Κυριακή τρώγαμε πάντα κοκκινιστό με μακαρόνια.", "audio": "hypertts-3c64bc9eb35793bf8de3c660227305880617ed5b241842ea95808f9f.mp3"}, {"front": "spoon sweet (fruit in syrup)", "back": "το γλυκό του κουταλιού", "audio": "hypertts-2c80660daa598a520bdb23e38397f3102c9a8ae086ba4d08b80a4e5f.mp3"}, {"front": "In the village they always treat you to a spoon sweet.", "back": "Στο χωριό σε κερνάνε πάντα ένα γλυκό του κουταλιού.", "audio": "hypertts-ab24b736cb1b3c20b2052c7a01aea2e8d89012d21d1f9d99263d6db9.mp3"}, {"front": "Christmas honey cookies / Christmas butter cookies", "back": "τα μελομακάρονα / οι κουραμπιέδες", "audio": "hypertts-2ee73eb82b2653b5f7c9b7a3f24de1b29916980e3865ea652f216cf4.mp3"}, {"front": "At Christmas every home has melomakarona and kourabiedes.", "back": "Τα Χριστούγεννα κάθε σπίτι έχει μελομακάρονα και κουραμπιέδες.", "audio": "hypertts-a9c81ffad2d6a60646fe5a784eb2f6dbe0e83041fce8b0721e586131.mp3"}, {"front": "sweet / salty", "back": "γλυκός / αλμυρός", "audio": "hypertts-c39ecb4fb44f3fcffece71a0c4190883b8e51ad657016c2d6815c195.mp3"}, {"front": "What do you prefer for breakfast? Sweet or savoury?", "back": "Τι προτιμάς για πρωινό; Γλυκό ή αλμυρό;", "audio": "hypertts-61c76c344e105f44894ab4e819a0363ea7bd77b557a4d21de6e764a4.mp3"}, {"front": "sour (masc. / fem. / neuter)", "back": "ξινός / ξινή / ξινό", "audio": "hypertts-5a18bc15a586f0cace9590675a204451e2128698d3469bd893811463.mp3"}, {"front": "The yoghurt is a bit sour.", "back": "Το γιαούρτι είναι λίγο ξινό.", "audio": "hypertts-124820b97364cb09de7f61f3532ab5bcafb3ca74adc1634c5b903d7a.mp3"}, {"front": "bitter (masc. / fem. / neuter)", "back": "πικρός / πικρή / πικρό", "audio": "hypertts-7cd2f67f050c36b3686c995e35ffcdb75e071ac72a6bcbac138d0ac1.mp3"}, {"front": "Greek coffee without sugar is bitter.", "back": "Ο ελληνικός καφές χωρίς ζάχαρη είναι πικρός.", "audio": "hypertts-dbb68def8dbc829ed775ee03ae4c8bf303f9e1c5c3068e899670f6e9.mp3"}, {"front": "spicy (masc. / fem. / neuter)", "back": "καυτερός / καυτερή / καυτερό", "audio": "hypertts-68d97fd5a8667fdbbc932ba22a5c12e44f9fdbcc01e0ba8f460d28a9.mp3"}, {"front": "I don't eat spicy food.", "back": "Δεν τρώω καυτερά φαγητά.", "audio": "hypertts-9647bc57beec4b44e2f1949b1189fe47410cd2cd6bfe0cb540d59564.mp3"}, {"front": "boiling hot (masc. / fem. / neuter)", "back": "καυτός / καυτή / καυτό", "audio": "hypertts-1601d8c99d41eea2d5344d5d49a1df72893de875c01d694b6b590594.mp3"}, {"front": "The soup is boiling hot. We wait a bit.", "back": "Η σούπα είναι καυτή. Περιμένουμε λίγο.", "audio": "hypertts-19e20a92840c99ddabce38a6456719fbe04cd8ee4ce1f77692c187d6.mp3"}, {"front": "crispy / crunchy (masc. / fem. / neuter)", "back": "τραγανός / τραγανή / τραγανό", "audio": "hypertts-56dd1118a97b6e96aa5a89d4adb07576168565aa3f70e0d5d2085bec.mp3"}, {"front": "The bread is warm and crunchy.", "back": "Το ψωμί είναι ζεστό και τραγανό.", "audio": "hypertts-26150a4429e027c8fd08755eeb250c176690a55f269b90000142b6b0.mp3"}, {"front": "juicy (masc. / fem. / neuter)", "back": "ζουμερός / ζουμερή / ζουμερό", "audio": "hypertts-798097e9c4533cc45bbbf6d409fd4ec52033792df999e81fcc130d85.mp3"}, {"front": "The lamb chops are very juicy.", "back": "Τα παϊδάκια είναι πολύ ζουμερά.", "audio": "hypertts-ef27bed00e6d8fd2ee4c192a8b813a2c50ec366ea1275f129e5b5683.mp3"}, {"front": "stale (masc. / fem. / neuter)", "back": "μπαγιάτικος / μπαγιάτικη / μπαγιάτικο", "audio": "hypertts-b617063995105e9f8763956467191bd9a264b6f0ae96bd26b8949934.mp3"}, {"front": "The bread is from yesterday. It's stale.", "back": "Το ψωμί είναι από χθες. Είναι μπαγιάτικο.", "audio": "hypertts-6202db0c0191d6ae90744a1c523b51a674c2c30858530752adce95ac.mp3"}, {"front": "filling (masc. / fem. / neuter)", "back": "χορταστικός / χορταστική / χορταστικό", "audio": "hypertts-b8576bbc9ffc592a75e0a23381a9541a3aacfe1b48920c98d8549785.mp3"}, {"front": "Pulses are very filling.", "back": "Τα όσπρια είναι πολύ χορταστικά.", "audio": "hypertts-875c5a1f57223c278484e7e7788c46bdfc1e2826dfe1b5a047d9dca0.mp3"}, {"front": "We're having people over (for a meal)", "back": "Κάνουμε τραπέζι", "audio": "hypertts-4254f81800ce514437bb09767a3c2d254fa8cba27c764f707d7bf88b.mp3"}, {"front": "On Saturday we're having people over. Do you want to come?", "back": "Το Σάββατο κάνουμε τραπέζι. Θέλεις να έρθεις;", "audio": "hypertts-d24daef60f9ca8e376acd39e96e3f8312a0afbe4a47f1d8824480a66.mp3"}, {"front": "What shall I bring?", "back": "Τι να φέρω;", "audio": "hypertts-bfb3e453bedde0c7849f1dfeb793eaaeefdeae213cc34eae042eaabe.mp3"}, {"front": "I'd love to come! What shall I bring?", "back": "Θα έρθω με χαρά! Τι να φέρω;", "audio": "hypertts-ee7de1b2579a2edab5c52b22a7ba85c776f9193892c34bf0693d265b.mp3"}, {"front": "You shouldn't have!", "back": "Δεν έπρεπε!", "audio": "hypertts-144cb4aa5ce582199d7c8dd7600ccbfc28acf0ed2e41df724425e862.mp3"}, {"front": "Sweets and wine? You shouldn't have!", "back": "Γλυκά και κρασί; Δεν έπρεπε!", "audio": "hypertts-258c32c9085082429362dbec7b25fd349d5872093dfd898466f066a5.mp3"}, {"front": "Make yourself at home! (lit. like at your home)", "back": "Σαν στο σπίτι σου!", "audio": "hypertts-8330e1d3c62c1b0528b2e153c89a8ae2cf11c74fd981d284f04d1c25.mp3"}, {"front": "Welcome! Make yourself at home!", "back": "Καλώς ήρθες! Σαν στο σπίτι σου!", "audio": "hypertts-015ae06fb1c821bf5eb057a92b97e9941305bd460470bab054c5f3b5.mp3"}, {"front": "Bottoms up! (lit. white bottom)", "back": "Άσπρο πάτο!", "audio": "hypertts-8521dac313b61a9d556671413cec87dd1e6f51b65ab1a341015a3dcc.mp3"}, {"front": "Cheers! Bottoms up!", "back": "Στην υγειά μας! Άσπρο πάτο!", "audio": "hypertts-1f1beeffd17a473ef155dd23408b3efdc4cd1e77238e2ea37423708a.mp3"}, {"front": "You've eaten nothing!", "back": "Δεν έφαγες τίποτα!", "audio": "hypertts-8dcf8ac086601b9267b2587998897c303f130da6f08ac39deda09184.mp3"}, {"front": "You've eaten nothing! Shall I give you some more?", "back": "Δεν έφαγες τίποτα! Να σου βάλω κι άλλο;", "audio": "hypertts-85ad05291d66ff25e240dfda9c3ae8a548c5b907a8f92df70feed301.mp3"}, {"front": "I'm stuffed! (lit. I burst)", "back": "Έσκασα!", "audio": "hypertts-c0983f7868ef2e601c62b83c2080295c0900f2212fd18cbbb6a28641.mp3"}, {"front": "Thanks. I'm stuffed! I can't eat any more.", "back": "Ευχαριστώ. Έσκασα! Δεν μπορώ άλλο.", "audio": "hypertts-d0d0d1816458d5b97730036bc4869cbe00d1cf9bb7e6a26642ca0af9.mp3"}, {"front": "Bless your hands! (said to the cook)", "back": "Γεια στα χέρια σου!", "audio": "hypertts-0fdf59bc951b4b124ae5d7adb965a42f922d273b4b2161fcabe5410f.mp3"}, {"front": "Bless your hands Grandma!", "back": "Γεια στα χέρια σου γιαγιά!", "audio": "hypertts-45e443c1c80f08a25f561ff7d01c30abc797f92ab9c5b8869b3a84ed.mp3"}, {"front": "The cook's reply to Γεια στα χέρια σου (lit. be well)", "back": "Να 'σαι καλά!", "audio": "hypertts-5848ce3396327c875b16962b6564a22df9ab8ef592fb00ca875caaf4.mp3"}, {"front": "said after a meal (lit. good digestion)", "back": "Καλή χώνεψη!", "audio": "hypertts-b1464aa556759c01a1790d46176819e973987b18682412881f66f2e2.mp3"}, {"front": "Lovely food! Good digestion everyone!", "back": "Ωραίο φαγητό! Καλή χώνεψη σε όλους!", "audio": "hypertts-1a82297947c0594a03b05993ded785174dd62145bf13b0906c39a82b.mp3"}];
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let deck=shuffle(CARDS);let pos=0;let currentAudio=null;
function updateProgress(){
  document.getElementById('current-num').textContent=pos+1;
  document.getElementById('total-num').textContent=deck.length;
  document.getElementById('prog').style.width=Math.round(((pos+1)/deck.length)*100)+'%';
  document.getElementById('prev-btn').disabled=pos===0;
}
function showCard(){
  const card=deck[pos];
  document.getElementById('card-inner').classList.remove('flipped');
  document.getElementById('eng-text').textContent=card.front;
  document.getElementById('greek-text').textContent=card.back;
  document.getElementById('audio-btn').classList.remove('playing');
  document.getElementById('tap-hint').style.display='';
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  updateProgress();
}
function flipCard(){
  const flipped=document.getElementById('card-inner').classList.toggle('flipped');
  if(flipped){document.getElementById('tap-hint').style.display='none';playAudio();}
  else{document.getElementById('tap-hint').style.display='';}
}
function playAudio(){
  const card=deck[pos];
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  const btn=document.getElementById('audio-btn');
  const audio=new Audio(AUDIO_PATH+card.audio);
  currentAudio=audio;btn.classList.add('playing');
  audio.play().catch(()=>{});
  audio.onended=()=>{btn.classList.remove('playing');currentAudio=null;};
  audio.onerror=()=>{btn.classList.remove('playing');currentAudio=null;};
}
function nextCard(){if(pos<deck.length-1){pos++;showCard();}else{showDone();}}
function prevCard(){if(pos>0){pos--;showCard();}}
function showDone(){
  document.getElementById('study-view').classList.add('hidden');
  document.getElementById('done-view').classList.remove('hidden');
}
function restart(){
  deck=shuffle(CARDS);pos=0;
  document.getElementById('done-view').classList.add('hidden');
  document.getElementById('study-view').classList.remove('hidden');
  showCard();
}
showCard();
</script>
