<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polylogue — Unit 4 Lesson 14</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f4f0; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; color: #1a1a1a; }
  #app { width: 100%; max-width: 520px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
  .back-link { font-size: 13px; color: #888; text-decoration: none; display: flex; align-items: center; gap: 5px; }
  .back-link:hover { color: #1a1a1a; }
  .deck-tag { font-size: 12px; color: #888; background: #fff; border: 1px solid #e5e5e5; padding: 4px 12px; border-radius: 99px; }
  .progress-bar { height: 3px; background: #e5e5e5; border-radius: 99px; overflow: hidden; margin-bottom: 1.25rem; }
  .progress-fill { height: 100%; background: #1D9E75; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .counter { text-align: center; font-size: 13px; color: #888; margin-bottom: 1.5rem; letter-spacing: 0.02em; }
  .counter strong { color: #1a1a1a; font-weight: 600; }
  .card-scene { perspective: 1200px; margin-bottom: 1rem; cursor: pointer; user-select: none; }
  .card-inner { position: relative; width: 100%; transform-style: preserve-3d; transition: transform 0.45s cubic-bezier(0.4,0,0.2,1); }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 2.5rem 2rem; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .card-back { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotateY(180deg); }
  .card-label { font-size: 11px; color: #bbb; letter-spacing: 0.08em; text-transform: uppercase; }
  .card-text { font-size: 24px; font-weight: 500; color: #1a1a1a; text-align: center; line-height: 1.35; }
  .card-text.greek { font-size: 26px; }
  .audio-btn { display: flex; align-items: center; gap: 7px; padding: 7px 16px; border: 1px solid #e0e0e0; border-radius: 99px; background: transparent; color: #888; font-size: 13px; cursor: pointer; transition: background 0.15s; font-family: inherit; }
  .audio-btn:hover { background: #f5f4f0; color: #555; }
  .audio-btn.playing { color: #1D9E75; border-color: #1D9E75; }
  .tap-hint { text-align: center; font-size: 13px; color: #bbb; margin-bottom: 1rem; height: 20px; }
  .nav-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1.5rem; }
  .nav-btn { padding: 14px 4px; border-radius: 10px; border: 1px solid #e5e5e5; background: #fff; cursor: pointer; font-size: 14px; font-weight: 500; font-family: inherit; color: #1a1a1a; transition: background 0.15s, opacity 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .nav-btn:hover:not(:disabled) { background: #f5f4f0; }
  .nav-btn.primary { background: #1D9E75; color: #fff; border-color: #1D9E75; }
  .nav-btn.primary:hover { opacity: 0.9; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .hidden { display: none !important; }
  .done-screen { background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 2.5rem 2rem; text-align: center; }
  .done-title { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
  .done-sub { font-size: 14px; color: #888; margin-bottom: 1.5rem; line-height: 1.5; }
  .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .action-btn { padding: 11px 28px; border: 1px solid #e0e0e0; border-radius: 10px; background: transparent; color: #1a1a1a; font-size: 14px; font-family: inherit; cursor: pointer; transition: background 0.15s, opacity 0.15s; text-decoration: none; display: inline-block; }
  .action-btn:hover { background: #f5f4f0; }
  .action-btn.primary { background: #1D9E75; color: #fff; border-color: #1D9E75; }
  .action-btn.primary:hover { opacity: 0.9; }
  @media (max-width: 400px) { .card-text { font-size: 18px; } .card-text.greek { font-size: 20px; } .card-face { padding: 2rem 1.25rem; min-height: 170px; } }
</style>
</head>

<script>

const CARDS=[{"front": "The children of the teacher (female teacher)", "back": "Τα παιδιά της δασκάλας", "audio": "hypertts-77adfeafd3fd192fe18941a883b821cece6f186e66ae26fbed34a7ed.mp3"}, {"front": "The children of this teacher (female teacher)", "back": "Τα παιδιά αυτής της δασκάλας", "audio": "hypertts-b61602d36e77b52a933f796cbfa1d8f14242a25d3b3b44e9eee7dc4d.mp3"}, {"front": "The children of that female teacher", "back": "Τα παιδιά εκείνης της δασκάλας", "audio": "hypertts-6bce5cbfc4694a56ffac6cd5ad098b5cbb908db7e9e4b496782ad6e7.mp3"}, {"front": "Woman", "back": "Γυναίκα", "audio": "hypertts-ca743121128623cf703b9d68e6cf9e5f9a908d0787a890e0b66fecd7.mp3"}, {"front": "The child of this woman", "back": "Το παιδί αυτής της γυναίκας", "audio": "hypertts-72aa90a60b5fe591cf2c0ab759e2068a4d8b045d0ca2c57a5d0f4074.mp3"}, {"front": "so", "back": "τόσο", "audio": "hypertts-5713f597f4cd48b84a71c2a4fa285b470f7b8dbe051cf455617ffc15.mp3"}, {"front": "It is so good", "back": "είναι τόσο καλό", "audio": "hypertts-6417d85f9b2f35f3c37a18b2beacf63102c0fce24409c001adfce72c.mp3"}, {"front": "Amazing / wonderful", "back": "καταπληκτικό", "audio": "hypertts-dc2a6f5ed63379e8c8954b51fd0fb0b407af37b00b5483fe238d38aa.mp3"}, {"front": "The toy of this child is amazing", "back": "το παιχνίδι αυτού του παιδιού είναι καταπληκτικό", "audio": "hypertts-8453795d34a0f3ce23f999b52348da29a94368b8e4ae6c3cc36249df.mp3"}, {"front": "I go / I am going", "back": "πάω / πηγαίνω", "audio": "hypertts-d78f3c54b0abf5df106d19913f76dd585bc90bf34f64edc3c0ebacd1.mp3"}, {"front": "We go / we are going", "back": "πηγαίναμε / πάμε", "audio": "hypertts-b4a307426793ec6342d7c93656e0c853dac224c24315c44bd6d6dad8.mp3"}, {"front": "Let's go to my friend's house (female friend)", "back": "πάμε στο σπίτι της φίλης μου", "audio": "hypertts-f2c263c4d0641abaa806809e22557de2961da4913b564f79cbb6acbd.mp3"}, {"front": "We are going (emphatic)", "back": "Εμείς πάμε", "audio": "hypertts-84e3ab2bbc576117d464ae259c6dcec8658b0022e1db8c0d34575721.mp3"}, {"front": "You are going (informal)", "back": "πηγαίνεις / πας", "audio": "hypertts-3f2d1d9dd30a37ae97d2580076dfb069e7a120c3ffa2380314acfad4.mp3"}, {"front": "Where will you go? (emphatic you)", "back": "εσύ που θα πας;", "audio": "hypertts-e812033e566334d0ec9c438eccacbf59895dda420b2a8d8a8da298b3.mp3"}, {"front": "He/she goes", "back": "πηγαίνει / πάει", "audio": "hypertts-84168e70009feb1312d86733e9d58b416fa90e449f3350dcb7446c71.mp3"}, {"front": "He is going now (emphatic he)", "back": "Αυτός πάει τώρα", "audio": "hypertts-53c0da04674047a77622c3e13aabcde5345f38921eca433c21276d0d.mp3"}, {"front": "Does she see me? (emphatic she)", "back": "Αυτή με βλέπει;", "audio": "hypertts-f6948e885df8898030271d5a73029202959fc380e5708e136308e482.mp3"}, {"front": "Does she see me? (emphatic me)", "back": "εμένα βλέπει;", "audio": "hypertts-18660d665d50f36fcd0e69a047b0ca1c8eaa099736e5e73b650d0c22.mp3"}, {"front": "Does she see me? (very emphatic)", "back": "εμένα με βλέπει;", "audio": "hypertts-88f2111f581f562bd359a359d785c532ef3af3387a3ba94c4b117fbb.mp3"}, {"front": "I see you (not him)", "back": "εσένα βλέπω", "audio": "hypertts-f86555744450dcf08bdd9664c51bca8769c7e55cff7ea607d5e38f73.mp3"}, {"front": "I see her (emphatic)", "back": "αυτήν βλέπω", "audio": "hypertts-7a2c9f2f10f22f482fdae6d36b7e5943ecd210957a5dabb2adc07c21.mp3"}, {"front": "I like it (emphatic)", "back": "εμένα μου αρέσει", "audio": "hypertts-b30be145ba99e46c0d2b4c40f8062f7b39fb43c610a988b9b1714669.mp3"}, {"front": "I am speaking to you", "back": "σου μιλάω", "audio": "hypertts-fdf04658b55eea15833f281ab242131dad5b19b25312cda6368aa514.mp3"}, {"front": "I am speaking to you (emphatic)", "back": "εσένα σου μιλάω", "audio": "hypertts-bbf34ab04411ddd79c1fc67335aa586714b217193a44aac1b320267c.mp3"}, {"front": "I am speaking to you (literally to you)", "back": "σε εσένα μιλάω", "audio": "hypertts-5cc6de1f6a88d3c0d0373d31a929ac6fd57e493ee9c12c870b0a7d5f.mp3"}, {"front": "He gave", "back": "έδωσε", "audio": "hypertts-a96480e73bad48ac829508fab4458af8f66342610add94349f88d33a.mp3"}, {"front": "He didn't give it to me", "back": "δεν μου το έδωσε", "audio": "hypertts-a8ab682b0d818a5a0c09b0b474cc1409fd8887f2ddd1b1e46666c634.mp3"}, {"front": "He didn't give it to me (emphatic)", "back": "εμένα δεν μου το έδωσε", "audio": "hypertts-6b0e93abf70f85ea61cac9e0a479145259dce673c8118d9be9e9a671.mp3"}, {"front": "You like it (emphatic)", "back": "Εσένα σου αρέσει", "audio": "hypertts-ea17bc131db6c56cc536cf9e6972c957ef4f87bc9d52087671e1ec34.mp3"}, {"front": "He didn't give it to me (using the word for to)", "back": "δεν το έδωσε σε μένα", "audio": "hypertts-dba7509d10fe0be4254ed637d2787f062ca2c651a699508dd673cd4c.mp3"}, {"front": "From me", "back": "από μένα", "audio": "hypertts-1f20be65ecd9929604a6cec6bf5edd11e2e490b2a0ba22a58be71f73.mp3"}, {"front": "with me", "back": "με μένα", "audio": "hypertts-d887faefdafcb9a5ab914ad4df750dfb42547f26c36d6750c210c8e9.mp3"}, {"front": "with you", "back": "με σένα", "audio": "hypertts-5d7ae00f7811642f58979b971028c789d04d445405fc54b37af5c7d8.mp3"}, {"front": "to you", "back": "σε σένα", "audio": "hypertts-42527c4cc34285eb45d69dd200025aa7ff0e53b1ce6d161d3856fe34.mp3"}, {"front": "Don't you like it?", "back": "δεν σου αρέσει;", "audio": "hypertts-9c6319abfa432cfe311f8a89b813926fb8d6ce3e7c69bbb6ae364ab9.mp3"}, {"front": "Don't you like it? (with emphasis)", "back": "εσένα δεν σου αρέσει;", "audio": "hypertts-2f0d5c67029414b9560cee2ca9c08ea389aa1b0276d543b0e34303e2.mp3"}, {"front": "To him", "back": "σε αυτόν", "audio": "hypertts-817ace028a889222200d5c305c9c1a945e7084d73fd5b493145ae8cf.mp3"}, {"front": "for him", "back": "για αυτόν", "audio": "hypertts-887bdf0a11e146872c75188ce7ba172a4a7d00b06f088f948594d3ea.mp3"}, {"front": "for her", "back": "για αυτήν", "audio": "hypertts-aed3d98194a536a8879d0fc0e19de5bb31100ab846de96818e28d263.mp3"}, {"front": "with her", "back": "με αυτήν", "audio": "hypertts-08f2b7fcaf4e864db151bf49450b202c9dbf3eef7598ce650e614a92.mp3"}, {"front": "to her", "back": "σε αυτήν", "audio": "hypertts-87358393aa23bf8aed1a9c9249427ed925b7b262ca31575fb8b799f8.mp3"}, {"front": "to them (female)", "back": "σε αυτές", "audio": "hypertts-932283c045c6b5cdc267aa6659c009b297a9002c3dd4d741a5b977d5.mp3"}, {"front": "to them (masc. or mixed)", "back": "σε αυτούς", "audio": "hypertts-d49f8c632111290644a4bb47670eb380bde0210c9131505107a9d248.mp3"}, {"front": "I am with them now", "back": "είμαι με αυτούς τώρα", "audio": "hypertts-2141eb1a79d97e68da26e4f10284afd990221cdd0f62a2a589b66ff4.mp3"}, {"front": "It is from me", "back": "είναι από μένα", "audio": "hypertts-9be6c2cdadfee75d9d3e82afe2522689d2ba0704e131916028bf7aba.mp3"}, {"front": "Is it from you?", "back": "είναι από σένα;", "audio": "hypertts-7e9c8d0f382abfd0bb0a1a9223b8392bb23dfbc4f27c680deb8c17a2.mp3"}, {"front": "I saw them (masc. or mixed)", "back": "τους είδα", "audio": "hypertts-79a8796a7aa396c96ba71b69e1eff614181bdfa20ec1ff29290fef29.mp3"}, {"front": "I saw them (with emphasis)", "back": "αυτούς τους είδα", "audio": "hypertts-fa7805e3d395384f394488d90ea64471ef1a2556929f3c02bf8a0228.mp3"}, {"front": "Did you see us?", "back": "μας είδες;", "audio": "hypertts-f8a5ca354ee20989dd88c959f449ee89638444113a60d85690023449.mp3"}, {"front": "Did you see us? (you plural)", "back": "μας είδατε;", "audio": "hypertts-91633a523f60e5fb74a07c83a18490d3c7ec14e47534446d6a4000d3.mp3"}, {"front": "Did you see us? (with emphasis - you plural)", "back": "εμάς μας είδατε;", "audio": "hypertts-e60f34281e18e986086199999d7925daff6772dea3c7c5de7e3f8551.mp3"}, {"front": "I saw you guys (emphatic)", "back": "είδα εσάς", "audio": "hypertts-c12fb38c76ee644f6a9b00e5d63db56fa2141bf7ea6d26629222151b.mp3"}, {"front": "I saw you guys (emphatic - alt)", "back": "εσάς σας είδα", "audio": "hypertts-532eeab20725cfb72a2d7d9396ac693642608fe701e4b7c9a40f7597.mp3"}, {"front": "I didn't see you guys", "back": "δεν σας είδα", "audio": "hypertts-9c506d420af3a3cce590e9ae711d75fb284f07370fef925288f8cb3c.mp3"}, {"front": "I didn't see you guys (with emphasis)", "back": "εσάς δεν σας είδα", "audio": "hypertts-3616eb6fa9d5c5cac57efb1ee092c611c2d49ad771efcbcc84ee780d.mp3"}, {"front": "I sell", "back": "πουλάω", "audio": "hypertts-ad098bef679b3894565704c4ba1abbcdacce3731d361ea01c26a3846.mp3"}, {"front": "They didn't sell his car to me", "back": "δεν πούλησαν το αυτοκίνητό του σε μένα", "audio": "hypertts-74450f540993d707bee4d5d57f6fcd8e5ed98c8f6c36e0e01d558723.mp3"}, {"front": "They didn't sell his car to me (emphatic)", "back": "εμένα δεν μου πούλησαν το αυτοκίνητό του", "audio": "hypertts-2818d5f566649c84ef27a8e4e9f58f3f1ac39ac2e04e3a78045c1dc1.mp3"}];
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let deck=shuffle(CARDS);let pos=0;let currentAudio=null;
function updateProgress(){
  document.getElementById('current-num').textContent=pos+1;
  document.getElementById('total-num').textContent=deck.length;
  document.getElementById('prog').style.width=Math.round(((pos+1)/deck.length)*100)+'%';
  document.getElementById('prev-btn').disabled=pos===0;
}
function showCard(){
  const card=deck[pos];
  document.getElementById('card-inner').classList.remove('flipped');
  document.getElementById('eng-text').textContent=card.front;
  document.getElementById('greek-text').textContent=card.back;
  document.getElementById('audio-btn').classList.remove('playing');
  document.getElementById('tap-hint').style.display='';
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  updateProgress();
}
function flipCard(){
  const flipped=document.getElementById('card-inner').classList.toggle('flipped');
  if(flipped){document.getElementById('tap-hint').style.display='none';playAudio();}
  else{document.getElementById('tap-hint').style.display='';}
}
function playAudio(){
  const card=deck[pos];
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  const btn=document.getElementById('audio-btn');
  const audio=new Audio(AUDIO_PATH+card.audio);
  currentAudio=audio;btn.classList.add('playing');
  audio.play().catch(()=>{});
  audio.onended=()=>{btn.classList.remove('playing');currentAudio=null;};
  audio.onerror=()=>{btn.classList.remove('playing');currentAudio=null;};
}
function nextCard(){if(pos<deck.length-1){pos++;showCard();}else{showDone();}}
function prevCard(){if(pos>0){pos--;showCard();}}
function showDone(){
  document.getElementById('study-view').classList.add('hidden');
  document.getElementById('done-view').classList.remove('hidden');
}
function restart(){
  deck=shuffle(CARDS);pos=0;
  document.getElementById('done-view').classList.add('hidden');
  document.getElementById('study-view').classList.remove('hidden');
  showCard();
}
showCard();
</script>
</body>
</html>
